name: Verify Docker Build

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Push platform test images to GHCR for local Docker validation
        required: false
        type: boolean
        default: false
      image_tag:
        description: GHCR tag prefix used when publish_image is enabled
        required: false
        type: string
        default: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_docker_build:
    name: Verify Docker Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
            cache_scope: docker-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
            cache_scope: docker-linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: inputs.publish_image
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.publish_image }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}-${{ github.sha }}-${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
